<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Sales Route Schedule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="user-panel">
        <div class="user-box">
            <h2>Enter Your Name</h2>
            <p>Please enter your name or initials to track edits and notes.</p>
            <input type="text" id="user-name-input" placeholder="e.g., John S.">
            <button id="set-user-btn">Set User</button>
        </div>
    </div>

    <div id="app-body" class="hidden">
        <div class="header">
            <h1>Weekly Sales Route</h1>
            <div class="header-controls">
                <button id="show-add-panel-btn">Add Customer +</button>
                <div id="user-display"></div>
            </div>
        </div>
        
        <div class="calendar-view">
            <div class="calendar-day" id="cal-monday"><div class="day-header"><h3>Monday</h3><div class="day-start-toggle"><button class="day-start-btn active" data-day="monday" data-location="shop">Shop</button><button class="day-start-btn" data-day="monday" data-location="syracuse">Syracuse</button></div></div><div class="content dropzone"></div></div>
            <div class="calendar-day" id="cal-tuesday"><div class="day-header"><h3>Tuesday</h3><div class="day-start-toggle"><button class="day-start-btn active" data-day="tuesday" data-location="shop">Shop</button><button class="day-start-btn" data-day="tuesday" data-location="syracuse">Syracuse</button></div></div><div class="content dropzone"></div></div>
            <div class="calendar-day" id="cal-wednesday"><div class="day-header"><h3>Wednesday</h3><div class="day-start-toggle"><button class="day-start-btn active" data-day="wednesday" data-location="shop">Shop</button><button class="day-start-btn" data-day="wednesday" data-location="syracuse">Syracuse</button></div></div><div class="content dropzone"></div></div>
            <div class="calendar-day" id="cal-thursday"><div class="day-header"><h3>Thursday</h3><div class="day-start-toggle"><button class="day-start-btn active" data-day="thursday" data-location="shop">Shop</button><button class="day-start-btn" data-day="thursday" data-location="syracuse">Syracuse</button></div></div><div class="content dropzone"></div></div>
            <div class="calendar-day" id="cal-friday"><div class="day-header"><h3>Friday</h3><div class="day-start-toggle"><button class="day-start-btn active" data-day="friday" data-location="shop">Shop</button><button class="day-start-btn" data-day="friday" data-location="syracuse">Syracuse</button></div></div><div class="content dropzone"></div></div>
        </div>
        
        <div class="controls">
             <button id="show-optimizer-btn">Optimize a Route</button>
        </div>

        <div id="entry-panel" class="hidden">
            <h2 id="panel-title">Add a New Customer</h2>
            <button type="button" class="cancel-btn" id="cancel-entry-panel">X</button>
            <div class="panel-columns">
                <div class="panel-left">
                    <div class="form-group"><label for="day-select">Day of the Week</label><select id="day-select"><option value="monday">Monday</option><option value="tuesday">Tuesday</option><option value="wednesday">Wednesday</option><option value="thursday">Thursday</option><option value="friday">Friday</option></select></div>
                    <div class="form-group"><label for="customer-search">Customer Name</label><input type="text" id="customer-search" placeholder="Start typing a name..."></div>
                    <div class="form-group" id="simple-temp-group"><label for="temperature-input">Customer Temperature (%)</label><input type="number" id="temperature-input" min="1" max="99" value="50"></div>
                    <button type="button" class="secondary-btn" id="toggle-sector-btn">Enable Sector Calculation</button>
                    <div id="sector-calculator" class="hidden">
                        <div class="sector-inputs">
                            <div class="form-group"><label>Parts</label><input type="number" class="sector-input" id="parts-val" min="1" max="99" value="50"></div>
                            <div class="form-group"><label>Service</label><input type="number" class="sector-input" id="service-val" min="1" max="99" value="50"></div>
                            <div class="form-group"><label>Chemicals</label><input type="number" class="sector-input" id="chemicals-val" min="1" max="99" value="50"></div>
                            <div class="form-group"><label>Projects</label><input type="number" class="sector-input" id="projects-val" min="1" max="99" value="50"></div>
                        </div>
                        <div class="form-group checkbox-group"><input type="checkbox" id="enable-weighting"><label for="enable-weighting">Enable Weighting</label></div>
                        <div id="weighting-inputs" class="hidden">
                            <div class="sector-inputs">
                                <div class="form-group weight-group"><input type="number" class="weight-input" id="parts-weight" value="25" min="0" max="100"><span>%</span></div>
                                <div class="form-group weight-group"><input type="number" class="weight-input" id="service-weight" value="25" min="0" max="100"><span>%</span></div>
                                <div class="form-group weight-group"><input type="number" class="weight-input" id="chemicals-weight" value="25" min="0" max="100"><span>%</span></div>
                                <div class="form-group weight-group"><input type="number" class="weight-input" id="projects-weight" value="25" min="0" max="100"><span>%</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button id="main-action-btn">Add to Route</button>
                        <button type="button" class="danger-btn hidden" id="delete-btn">Delete Entry</button>
                    </div>
                </div>
                <div id="notes-section" class="panel-right hidden">
                    <h3>Notes</h3>
                    <div id="notes-thread"></div>
                    <div class="form-group"><textarea id="note-input" placeholder="Add a new note..."></textarea><button type="button" class="secondary-btn" id="add-note-btn">Add Note</button></div>
                </div>
            </div>
        </div>

        <div id="optimizer-panel" class="hidden">
            <h2>Route Optimizer</h2>
            <button type="button" class="cancel-btn" id="cancel-optimizer-panel">X</button>
            <div id="optimizer-inputs">
                <div class="optimizer-config">
                    <div class="form-group"><label for="optimizer-start-location">Start Location</label><select id="optimizer-start-location"><option value="shop">Shop</option><option value="syracuse">Syracuse</option></select></div>
                    <div class="form-group"><label for="optimizer-start-time">Start Time</label><input type="time" id="optimizer-start-time" value="08:00"></div>
                    <div class="form-group"><label for="optimizer-interval">Time at Stop (minutes)</label><input type="number" id="optimizer-interval" value="15" min="0"></div>
                </div>
                <div class="form-group"><label for="optimizer-search">Add Customer / Location</label><input type="text" id="optimizer-search" placeholder="Search existing customers or new locations..."></div>
                <div id="optimizer-stops-list"></div>
                <button id="run-optimization-btn">Optimize This Route</button>
            </div>
            <div id="optimizer-results" class="hidden">
                <h3>Optimized Route</h3>
                <div id="optimizer-results-list"></div>
                <button type="button" class="secondary-btn" id="optimizer-back-btn">Back to Inputs</button>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="main.js" defer></script>

</body>
</html>
